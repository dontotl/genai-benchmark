name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python files
        run: python -m compileall genai_benchmark tests

      - name: Validate benchmark configuration
        run: python benchmark.py --dry-run --concurrency-levels 1,5 --streaming

      - name: Render dashboard
        run: python -m genai_benchmark.dashboard --runs-dir tests/fixtures/runs --output /tmp/genai-benchmark-dashboard-check.html

      - name: Verify docs site generation
        run: |
          python -m genai_benchmark.site --runs-dir tests/fixtures/runs --docs-dir /tmp/genai-benchmark-docs-check
          test -s /tmp/genai-benchmark-docs-check/dashboard.html
          test -s /tmp/genai-benchmark-docs-check/index.html
          test -s /tmp/genai-benchmark-docs-check/dashboard-preview.svg
